[mutmut]
paths_to_mutate =
    kareshafaa/clinical_rules.py
    kareshafaa/statemachine.py
tests_dir = tests/
also_copy =
    kareshafaa/
    kareshafaa_reference/
    scripts/
    samples/
pytest_add_cli_args_test_selection =
    tests/test_clinical_golden.py
    tests/test_differential.py
    tests/test_properties.py
    tests/test_statemachine.py
    tests/test_statemachine_exhaustive.py
    -k
    not owner_end_to_end and not sequences and not audit_chain
pytest_add_cli_args = -p no:warnings -x
