[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
markers =
    cohort: full 20k-cohort invariant check (needs `make seed-large`)
    safety: 'must never happen' safety suite (tests/safety; run alone with `pytest -m safety`)
