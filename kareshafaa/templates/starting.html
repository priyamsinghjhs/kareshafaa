<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2b5e">
  <title>Starting · KareShafaa</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/kareshafaa.css">
</head>
<body class="no-nav no-bottomnav">
  <main class="content" id="main"><div class="content-inner" style="max-width:560px">
    <h1 class="logo-h"><img class="logo-full" src="/static/brand/logo-horizontal.svg" alt="KareShafaa" width="227" height="64"></h1>
    <article class="card" role="status" aria-live="polite">
      <h2>Starting KareShafaa…</h2>
      <p>The service was idle and is starting up. This usually takes under a minute. The page will open by itself.</p>
      <div class="loading" id="wake-state">Waiting for the service</div>
      <p class="small muted">Nothing is stored on this device while you wait.</p>
    </article>
  </div></main>
  <script>
  (function () {
    const started = Date.now();
    if (new URLSearchParams(location.search).has("preview")) return;  // layout checks: stay on this page
    const go = () => {
      if (location.pathname === "/starting") { location.replace("/"); return; }  // opened directly
      const u = new URL(location.href); u.searchParams.set("ks_wait", "1"); location.replace(u.toString()); };
    const poll = () => fetch("/healthz", { cache: "no-store" }).then(r => { if (r.ok) go(); else setTimeout(poll, 2000); })
      .catch(() => setTimeout(poll, 2000));
    setInterval(() => { document.getElementById("wake-state").textContent = "Waiting for the service (" + Math.round((Date.now() - started) / 1000) + " s)"; }, 1000);
    poll();
  })();
  </script>
</body>
</html>
