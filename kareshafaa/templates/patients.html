{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1 data-i18n="patients">Patients</h1>
</div>
<div class="page-actions" id="reg-actions" hidden><a role="button" class="secondary" href="/recalls" id="recall-link"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="due-for-recall">Due for recall</span></a><a role="button" href="/patients/new"><svg class="icon" aria-hidden="true"><use href="#i-user-plus"/></svg><span data-i18n="register-a-patient">Register a patient</span></a></div></div>
<form class="filters" role="search" id="sf" data-nosubmit>
  <label for="pq"><span data-i18n="find-a-patient">Find a patient</span><input id="pq" type="search" inputmode="search" autocomplete="off" placeholder="Name, MRN, Emirates ID, passport or phone" data-i18n-placeholder="search-placeholder" minlength="2" maxlength="80"></label>
</form>
<div id="plist" aria-live="polite"><p class="small muted" data-i18n="type-to-search">Type 2+ characters to search.</p></div>
{% endblock %}
{% block scripts %}
<script src="{{ asset('js/patients_search.js') }}"></script>
{% endblock %}
