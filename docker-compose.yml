# Local or on-premises run with PostgreSQL:  docker compose up --build   ->  http://localhost:8000
# Put secrets in a .env file next to this file (never committed):
#   KARESHAFAA_SECRET_KEY=<64 random characters>
#   KARESHAFAA_DEMO_PASSWORD=<first password for the existing staff accounts, 12+ characters>  (internal variable name)
#   POSTGRES_PASSWORD=<database password>
# The database lives in the named volume "pgdata"; restarting or rebuilding the app never resets it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kareshafaa
      POSTGRES_USER: kareshafaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kareshafaa -d kareshafaa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      args:
        SEED_AT_BUILD: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      KARESHAFAA_MODE: production
      KARESHAFAA_DEMO_LOGINS: "false"
      KARESHAFAA_PUBLIC_DEMO: "0"
      KARESHAFAA_SECRET_KEY: ${KARESHAFAA_SECRET_KEY:?set KARESHAFAA_SECRET_KEY in .env}
      KARESHAFAA_DEMO_PASSWORD: ${KARESHAFAA_DEMO_PASSWORD:?set KARESHAFAA_DEMO_PASSWORD in .env}
      DATABASE_URL: postgresql://kareshafaa:${POSTGRES_PASSWORD}@db:5432/kareshafaa
      WEB_WORKERS: "2"
      KARESHAFAA_SWEEP_INTERVAL_SECONDS: "300"
      KARESHAFAA_LOG_FORMAT: json
    restart: unless-stopped
volumes:
  pgdata:
