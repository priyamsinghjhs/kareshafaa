name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage (fresh synthetic DB in a temp dir; never a live DB)
        run: python -m pytest -q -p no:warnings --cov=kareshafaa --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r kareshafaa -ll
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: npm install --prefix /tmp/axe axe-core@4
      - name: Build a throwaway synthetic database and run the axe-core WCAG 2.1 AA check
        env:
          KARESHAFAA_AXE_JS: /tmp/axe/node_modules/axe-core/axe.min.js
        run: KARESHAFAA_BROWSER_CHANNEL= bash scripts/ci_a11y.sh
